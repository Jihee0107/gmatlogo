<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>로고·썸네일 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@800&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ground:#F7F3EC;--paper:#FFFDF8;--sand:#EDE3D5;--line:#E3D8C8;--ink:#2C2925;--muted:#7B7167;
  --brown:#8A6A53;--brown-deep:#6F5240;--wood:#CDAE88;--ok:#2E5B45;--ok-soft:#E1EBE2;--bad:#B3261E;--radius:16px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;word-break:keep-all;color-scheme:light}
button,input{font:inherit;color:inherit}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;cursor:pointer;transition:background .15s,opacity .15s}
.btn:hover{background:#fff}
.btn.primary{background:var(--brown-deep);border-color:var(--brown-deep);color:#fff}
.btn.primary:hover{background:#5d4435}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.small{height:38px;padding:0 14px;font-size:14px}
.link{background:none;border:0;padding:4px;color:var(--brown);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:13px}
.link.danger{color:var(--bad)}
.link:disabled{opacity:.4;cursor:not-allowed}

/* 머리 · 탭 */
.top{display:flex;align-items:center;gap:14px;max-width:1120px;margin:0 auto;padding:20px 16px 4px}
#headLogo{height:44px;width:auto;max-width:150px;object-fit:contain}
.top h1{font-size:18px;margin:0;color:var(--brown-deep);line-height:1.3}
.top p{margin:0;font-size:13px;color:var(--muted)}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--sand);padding:4px;border-radius:12px}
.tabs button{padding:9px 18px;border:0;background:none;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* 공통 틀 */
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 32px;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:16px 20px;align-items:start}
.side{position:sticky;top:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--brown-deep);display:flex;justify-content:space-between;align-items:center}
.card h2 .link,.card h2 small{font-weight:400}
.card h2 small{color:var(--muted)}

/* 브랜드 */
.brandbar{max-width:1120px;margin:0 auto;padding:12px 16px 0}
.brand{display:grid;gap:14px}
.brand-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-head h2{margin:0 6px 0 0}
.brand-list{display:flex;gap:6px;flex-wrap:wrap}
.bchip{height:34px;padding:0 16px;border-radius:17px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.bchip:hover{color:var(--ink)}
.bchip[aria-pressed=true]{background:var(--brown-deep);border-color:var(--brown-deep);color:#fff}
.saved{margin-left:auto;font-size:12px;color:var(--muted)}
.saved.ok{color:var(--ok)}
.saved.bad{color:var(--bad)}
.brand-edit{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo-box{position:relative;display:grid;place-items:center;width:150px;height:92px;border:2px dashed var(--wood);border-radius:12px;cursor:pointer;overflow:hidden;flex:none;
  background:repeating-conic-gradient(#EFE7DB 0% 25%,#FBF8F2 0% 50%) 50%/16px 16px;transition:border-color .15s}
.logo-box:hover,.logo-box.over{border-color:var(--brown)}
.logo-box:focus-within{outline:2px solid var(--wood);outline-offset:2px}
.logo-box input{position:absolute;width:1px;height:1px;opacity:0}
.logo-box img{max-width:100%;max-height:100%;padding:10px;object-fit:contain;display:block}
.logo-box span{font-size:13px;font-weight:700;color:var(--brown-deep);background:rgba(255,253,248,.85);padding:4px 10px;border-radius:8px}
.brand-name{display:grid;gap:6px;width:220px}
.brand-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;white-space:nowrap}
.check input{width:18px;height:18px;accent-color:var(--brown-deep);margin:0}
.brand-tip{flex-basis:100%;margin:-4px 0 0;font-size:12px;color:var(--muted)}

/* 사진 넣는 칸 */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:128px;border:2px dashed var(--wood);border-radius:14px;background:#FBF7F0;cursor:pointer;text-align:center;padding:16px;transition:background .15s,border-color .15s}
.drop:hover,.drop.over{background:var(--sand);border-color:var(--brown)}
.drop:focus-within{outline:2px solid var(--wood);outline-offset:2px}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop strong{display:block;font-size:16px;color:var(--brown-deep)}
.drop span{font-size:13px;color:var(--muted)}

/* 입력 공통 */
.row{display:grid;gap:8px}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700}
.lab output,.lab small{font-weight:400;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.field{display:block;width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:15px}
.field:focus{outline:2px solid var(--wood);outline-offset:0;border-color:var(--wood)}
.field::placeholder{color:#B5AA9D}
input[type=range]{width:100%;accent-color:var(--brown-deep);height:28px;margin:0;cursor:pointer}
.seg{display:flex;background:var(--sand);border-radius:12px;padding:3px;gap:3px;flex:1;min-width:0}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg input:checked+span{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg input:focus-visible+span{outline:2px solid var(--wood)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.inline{display:flex;gap:8px;align-items:center}
.swatch{flex:none;width:46px;height:46px;padding:5px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.swatch::-webkit-color-swatch-wrapper{padding:0}
.swatch::-webkit-color-swatch{border:1px solid rgba(0,0,0,.12);border-radius:7px}

/* ── 로고 넣기 ── */
#tool-logo .a{grid-column:1;grid-row:1}
#tool-logo .s{grid-column:1;grid-row:2}
#tool-logo .side{grid-column:2;grid-row:1/span 2}
.files-head{display:flex;justify-content:space-between;align-items:center;margin:12px 2px 8px;font-size:13px;color:var(--muted)}
.thumbs{list-style:none;margin:0;padding:2px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:236px;overflow:auto}
.thumbs li{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sand);outline:3px solid transparent;outline-offset:-3px}
.thumbs li.on{outline-color:var(--brown-deep)}
.thumbs .pick{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs li.bad img{visibility:hidden}
.thumbs li.bad .pick::after{content:'열 수 없음';position:absolute;inset:0;display:grid;place-items:center;background:rgba(179,38,30,.75);color:#fff;font-size:11px;font-weight:700}
.thumbs .del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(44,41,37,.72);color:#fff;font-size:15px;line-height:22px;padding:0;cursor:pointer}
.set{display:grid;gap:18px}
.posrow{display:flex;align-items:center;gap:14px}
.posbox{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;width:132px;height:100px;padding:6px;background:var(--sand);border-radius:12px;flex:none}
.posbox label{position:relative;display:block}
.posbox input{position:absolute;opacity:0;width:1px;height:1px}
.posbox span{display:block;width:100%;height:100%;border-radius:5px;background:#fff;opacity:.6;cursor:pointer;transition:opacity .15s,background .15s}
.posbox span:hover{opacity:1}
.posbox input:checked+span{opacity:1;background:var(--brown-deep)}
.posbox input:focus-visible+span{outline:2px solid var(--wood)}
#posName{font-size:14px;color:var(--muted)}
.preview{display:grid;place-items:center;min-height:340px;background:var(--sand);border-radius:12px;overflow:hidden;padding:12px}
.preview canvas{display:block;max-width:100%;max-height:min(66vh,720px);width:auto;height:auto;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.preview .empty{color:var(--muted);font-size:14px;text-align:center;margin:0}
.meta{display:flex;justify-content:space-between;gap:12px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span:last-child{flex:none}
#tool-logo .x{display:grid;gap:10px;margin-top:14px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--sand);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brown-deep);transition:width .2s}
.result{background:var(--ok-soft);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.result p{margin:0;font-size:14px;color:var(--ok);font-weight:700}
.result p small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.result .btns{display:flex;gap:8px}
.result .btn{flex:1;height:44px;font-size:14px}
.busy #tool-logo .a,.busy #tool-logo .s,.busy .brandbar{pointer-events:none;opacity:.6}

/* ── 블로그 썸네일 ── */
#tool-thumb .card + .card{margin-top:16px}
#tool-thumb .drop{flex-direction:row;justify-content:flex-start;text-align:left;gap:14px;min-height:96px;padding:12px 16px}
#tool-thumb .drop strong{font-size:15px}
.drop .ph{width:68px;height:68px;border-radius:10px;background:var(--sand);flex:none;object-fit:cover;display:block}
.form{display:grid;gap:16px}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--brown-deep)}
.swatches .swatch{width:40px;height:40px;border-radius:50%;padding:3px}
.swatches .swatch::-webkit-color-swatch{border-radius:50%}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.fontpick label{position:relative}
.fontpick input{position:absolute;opacity:0;width:1px;height:1px}
.fontpick span{display:flex;align-items:center;justify-content:center;height:44px;padding:0 6px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;cursor:pointer;color:var(--ink);white-space:nowrap;overflow:hidden}
.fontpick span:hover{border-color:var(--wood)}
.fontpick input:checked+span{border-color:var(--brown-deep);box-shadow:inset 0 0 0 1px var(--brown-deep);background:#FBF7F0}
.fontpick input:focus-visible+span{outline:2px solid var(--wood)}
.stage{background:var(--sand);border-radius:12px;padding:14px;display:grid;place-items:center}
#cv{display:block;width:100%;max-width:600px;height:auto;aspect-ratio:1;border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);touch-action:none}
#cv.can-drag{cursor:grab}
#cv.dragging{cursor:grabbing}
.hint{margin:10px 2px 0;font-size:13px;color:var(--muted);text-align:center}
#tool-thumb .x{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.toast{grid-column:1/-1;margin:0;font-size:13px;color:var(--ok);text-align:center;min-height:20px}

.foot{text-align:center;font-size:13px;color:var(--muted);padding:8px 16px 28px}

/* 창을 좁게 줄였을 때 한 줄로 */
@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  #tool-logo .a,#tool-logo .s,#tool-logo .side{grid-column:1;grid-row:auto}
  .side{position:static}
}
</style>
</head>
<body>

<header class="top">
  <img id="headLogo" alt="" hidden>
  <div>
    <h1 id="pageTitle">로고 편집기</h1>
    <p id="pageDesc"></p>
  </div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="logo" aria-selected="true">로고 넣기</button>
    <button type="button" role="tab" data-tab="thumb" aria-selected="false">블로그 썸네일</button>
  </nav>
</header>

<!-- ======================= 브랜드 (로고 + 설정 묶음) ======================= -->
<div class="brandbar">
  <section class="card brand">
    <div class="brand-head">
      <h2>브랜드</h2>
      <div class="brand-list" id="brandList"></div>
      <button type="button" class="link" id="brandAdd">+ 브랜드 추가</button>
      <span class="saved" id="savedNote">설정은 브랜드별로 자동 저장돼요</span>
    </div>
    <div class="brand-edit">
      <label class="logo-box" id="logoBox" title="눌러서 고르거나, 로고 파일을 여기로 끌어다 놓으세요">
        <input type="file" id="logoInput" accept="image/*">
        <img id="brandLogo" alt="" hidden>
        <span id="logoEmpty">로고 첨부</span>
      </label>
      <div class="brand-name">
        <label class="lab" for="brandName">브랜드 이름</label>
        <input class="field" id="brandName" autocomplete="off">
      </div>
      <div class="brand-actions">
        <button type="button" class="btn small" id="logoPick">로고 첨부</button>
        <label class="check" id="removeWhiteWrap"><input type="checkbox" id="removeWhite"> 흰 배경 지우기</label>
        <button type="button" class="link" id="builtinReset" hidden>기본 지매트 로고로</button>
        <button type="button" class="link danger" id="brandDelete">브랜드 삭제</button>
      </div>
    </div>
  </section>
</div>

<!-- ======================= 로고 넣기 ======================= -->
<main class="wrap" id="tool-logo">
  <section class="card a">
    <h2>사진</h2>
    <label class="drop" id="drop">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <strong>사진 고르기</strong>
      <span>여러 장 한 번에 · 끌어다 놓아도 돼요</span>
    </label>
    <div class="files-head" id="filesHead" hidden>
      <span id="count"></span>
      <button type="button" class="link" id="clearBtn">전체 빼기</button>
    </div>
    <ul class="thumbs" id="thumbs"></ul>
  </section>

  <section class="card s">
    <h2>로고 설정 <button type="button" class="link" id="resetBtn">기본값으로</button></h2>
    <form class="set" id="settings" onsubmit="return false">
      <div class="row">
        <div class="lab">위치</div>
        <div class="posrow">
          <div class="posbox" role="radiogroup" aria-label="로고 위치" id="posBox"></div>
          <span id="posName"></span>
        </div>
      </div>
      <div class="row">
        <label class="lab" for="size">크기 <output id="sizeOut"></output></label>
        <input type="range" id="size" name="size" min="10" max="60" step="1">
      </div>
      <div class="row">
        <label class="lab" for="margin">가장자리 여백 <output id="marginOut"></output></label>
        <input type="range" id="margin" name="margin" min="0" max="10" step="0.5">
      </div>
      <div class="row">
        <label class="lab" for="opacity">진하기 <output id="opacityOut"></output></label>
        <input type="range" id="opacity" name="opacity" min="20" max="100" step="5">
      </div>
      <div class="row">
        <div class="lab">로고 색</div>
        <div class="inline">
          <div class="seg" role="radiogroup" aria-label="로고 색">
            <label><input type="radio" name="tint" value="orig"><span>원본 색</span></label>
            <label><input type="radio" name="tint" value="white"><span><i class="dot" style="background:#fff"></i>흰색</span></label>
            <label><input type="radio" name="tint" value="custom"><span>색 지정</span></label>
          </div>
          <input type="color" class="swatch" name="tintColor" aria-label="로고 색 고르기" title="로고 색 고르기">
        </div>
      </div>
      <div class="row">
        <div class="lab">그림자 <small>밝은 사진에서 로고가 잘 보이게</small></div>
        <div class="seg" role="radiogroup" aria-label="그림자">
          <label><input type="radio" name="shadow" value="off"><span>없음</span></label>
          <label><input type="radio" name="shadow" value="on"><span>있음</span></label>
        </div>
      </div>
      <div class="row">
        <div class="lab">사진 크기 <small id="outHint"></small></div>
        <div class="seg" role="radiogroup" aria-label="사진 크기">
          <label><input type="radio" name="output" value="square"><span>1080×1080</span></label>
          <label><input type="radio" name="output" value="orig"><span>원본 크기</span></label>
        </div>
      </div>
      <div class="row">
        <div class="lab">저장 형식 <small id="fmtHint"></small></div>
        <div class="seg" role="radiogroup" aria-label="저장 형식">
          <label><input type="radio" name="format" value="png"><span>PNG</span></label>
          <label><input type="radio" name="format" value="jpg"><span>JPG</span></label>
        </div>
      </div>
    </form>
  </section>

  <div class="side">
    <section class="card">
      <h2>미리보기</h2>
      <div class="preview">
        <canvas id="preview" hidden></canvas>
        <p class="empty" id="emptyMsg"></p>
      </div>
      <div class="meta" id="meta" hidden><span id="metaName"></span><span id="metaSize"></span></div>
    </section>

    <section class="x">
      <button type="button" class="btn primary block" id="saveBtn" disabled>로고 넣고 저장</button>
      <div class="progress" id="progress" hidden><div class="bar"><i id="barFill"></i></div><span id="progText"></span></div>
      <div class="result" id="result" hidden>
        <p id="resultText"></p>
        <div class="btns">
          <button type="button" class="btn" id="downloadBtn">다시 받기</button>
        </div>
      </div>
    </section>
  </div>
</main>

<!-- ======================= 블로그 썸네일 ======================= -->
<main class="wrap" id="tool-thumb" hidden>
  <div>
    <section class="card">
      <h2>시공 정보</h2>
      <form class="form" id="thumbInfo" onsubmit="return false">
        <label class="drop" id="tDrop">
          <input type="file" id="tFileInput" accept="image/*">
          <img class="ph" id="tThumb" alt="" hidden>
          <div class="ph" id="tThumbEmpty"></div>
          <div>
            <strong id="dropTitle">사진 고르기</strong>
            <span id="dropSub">끌어다 놓거나 Ctrl+V로 붙여넣어도 돼요</span>
          </div>
        </label>
        <div class="row">
          <label class="lab" for="apt">아파트 이름</label>
          <input class="field" id="apt" name="apt" placeholder="예) 래미안 원베일리" autocomplete="off">
        </div>
        <div class="row">
          <label class="lab" for="space">시공 공간</label>
          <input class="field" id="space" name="space" placeholder="예) 거실, 복도, 주방 시공" autocomplete="off">
        </div>
        <div class="row">
          <label class="lab" for="mat">매트</label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ======================= 공통 ======================= */
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
const safeName = s => String(s || '').replace(/[\\/:*?"<>|]/g, '').trim();

function loadImg(src){
  return new Promise((res, rej) => {
    const i = new Image();
    i.decoding = 'async';
    i.onload = () => res(i);
    i.onerror = () => rej(new Error('load'));
    i.src = src;
  });
}
const fileToDataURL = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(f);
});
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ---------- 저장소: 브라우저 안 IndexedDB (안 되면 localStorage) ---------- */
const KV = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('logo-tools', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), q = fn(t.objectStore('kv'));
    t.oncomplete = () => res(q.result);
    t.onerror = t.onabort = () => rej(t.error);
  }));
  return {
    async get(k){
      try{ const v = await run('readonly', s => s.get(k)); if (v !== undefined) return v; }catch(e){}
      try{ const v = localStorage.getItem('kv:' + k); return v ? JSON.parse(v) : undefined; }catch(e){ return undefined; }
    },
    async set(k, v){
      try{ await run('readwrite', s => s.put(v, k)); return true; }
      catch(e){ try{ localStorage.setItem('kv:' + k, JSON.stringify(v)); return true; }catch(e2){ return false; } }
    }
  };
})();

/* ---------- 기본값 ---------- */
const LOGO_DEFAULTS = {pos:'br', size:28, margin:2, opacity:100, tint:'orig', tintColor:'#6F5240', shadow:'off', output:'square', format:'png'};
const THUMB_DEFAULTS = {tpl:'card', titleFont:'notoserif', bodyFont:'pretendard', frameColor:'#F7F3EC', frameAlpha:80, mat:'', color:'', dot:'#F6F3EE'};

/* ---------- 브랜드: 로고 + 로고 설정 + 썸네일 설정을 브랜드마다 저장 ---------- */
const Brand = (() => {
  const KEY = 'brands-v1';
  let state = null;   // {profiles:[{id, name, logoSrc, builtin, removeWhite, opt, thumb}], current}
  let logo = null;    // 지금 브랜드 로고 (흰 배경 지우고 빈 여백 자른 것)
  let logoURL = '';
  const chains = new Map();
  const subs = [];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const make = (name, extra = {}) => ({id: uid(), name, logoSrc: null, builtin: false, removeWhite: false,
    opt: {...LOGO_DEFAULTS}, thumb: {...THUMB_DEFAULTS}, ...extra});

  function seed(){
    const g = make('지매트', {builtin: true});
    g.thumb.mat = 'G-80 매트 (80×80)';
    g.thumb.color = '모던 화이트';
    // 예전(지매트 전용) 버전에서 쓰던 설정이 있으면 옮겨옴
    try{
      const o = JSON.parse(store.get('gmat-logo-opt-v2') || 'null');
      if (o){
        for (const k of ['pos','size','margin','opacity','shadow','output','format']) if (k in o) g.opt[k] = o[k];
        if (o.color === 'white') g.opt.tint = 'white';
        else if (o.color === 'brown'){ g.opt.tint = 'custom'; g.opt.tintColor = '#6F5240'; }
      }
      const t = JSON.parse(store.get('gmat-thumb-opt') || 'null');
      if (t && t.tpl) g.thumb.tpl = t.tpl;
    }catch(e){}
    return {profiles: [g, make('토리매트'), make('우아매트')], current: g.id};
  }
  async function init(){
    let s = await KV.get(KEY);
    if (!s || !Array.isArray(s.profiles) || !s.profiles.length) s = seed();
    for (const p of s.profiles){
      p.opt = {...LOGO_DEFAULTS, ...p.opt};
      p.thumb = {...THUMB_DEFAULTS, ...p.thumb};
    }
    if (!s.profiles.some(p => p.id === s.current)) s.current = s.profiles[0].id;
    state = s;
    await loadLogo();
    render(); emit();
  }
  const cur = () => state ? state.profiles.find(p => p.id === state.current) : null;
  const srcOf = p => p.logoSrc || (p.builtin ? LOGO_SRC : null);
  const emit = () => subs.forEach(fn => fn());

  /* 로고 손질: 흰 배경 지우기 → 빈 여백 자르기 */
  function clearWhiteBg(d, w, h){
    // 가장자리에서 이어진 흰 부분만 지움 (로고 안쪽 흰 글씨는 그대로)
    const near = p => {
      const i = p * 4;
      if (d[i+3] < 16) return true;
      const mn = Math.min(d[i], d[i+1], d[i+2]), mx = Math.max(d[i], d[i+1], d[i+2]);
      return mn >= 200 && mx - mn <= 36;
    };
    const seen = new Uint8Array(w * h), stack = [];
    const push = p => { if (!seen[p] && near(p)){ seen[p] = 1; stack.push(p); } };
    for (let x = 0; x < w; x++){ push(x); push((h - 1) * w + x); }
    for (let y = 0; y < h; y++){ push(y * w); push(y * w + w - 1); }
    while (stack.length){
      const p = stack.pop(), i = p * 4;
      const t = Math.min(1, Math.max(0, (Math.min(d[i], d[i+1], d[i+2]) - 200) / 45)); // 245 이상이면 완전히 투명
      if (t >= 1) d[i+3] = 0;
      else if (t > 0){
        // 흰색이 섞인 테두리 픽셀은 흰색을 빼서 하얀 테 없이
        for (let k = 0; k < 3; k++) d[i+k] = Math.max(0, Math.min(255, Math.round((d[i+k] - 255 * t) / (1 - t))));
        d[i+3] = Math.round(d[i+3] * (1 - t));
      }
      const x = p % w;
      if (x > 0) push(p - 1);
      if (x < w - 1) push(p + 1);
      if (p >= w) push(p - w);
      if (p < w * (h - 1)) push(p + w);
    }
  }
  function prepLogo(img, removeWhite){
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d', {willReadFrequently: true});
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, w, h);
    const id = x.getImageData(0, 0, w, h), d = id.data;
    if (removeWhite) clearWhiteBg(d, w, h);
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++){
      if (d[(yy * w + xx) * 4 + 3] > 8){
        if (xx < x0) x0 = xx; if (xx > x1) x1 = xx;
        if (yy < y0) y0 = yy; if (yy > y1) y1 = yy;
      }
    }
    if (x1 < 0) return null;
    x.putImageData(id, 0, 0);
    const out = document.createElement('canvas');
    out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
    out.getContext('2d').drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    return out;
  }
  function whiteCorners(img){
    const c = document.createElement('canvas');
    c.width = c.height = 32;
    const x = c.getContext('2d', {willReadFrequently: true});
    x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    return [0, 31, 32 * 31, 32 * 32 - 1].every(p => d[p*4+3] > 240 && Math.min(d[p*4], d[p*4+1], d[p*4+2]) > 235);
  }
  async function loadLogo(){
    chains.clear(); logo = null; logoURL = '';
    const p = cur(), src = srcOf(p);
    if (!src) return;
    try{
      logo = prepLogo(await loadImg(src), p.removeWhite);
      if (logo) logoURL = logo.toDataURL('image/png');
    }catch(e){ logo = null; }
  }

  /* 색깔별 로고 (원본 → 절반 → 절반 … 작게 찍어도 계단현상 없게) */
  function chain(tint, color){
    const key = tint === 'custom' ? 'c' + color : tint;
    if (chains.has(key)) return chains.get(key);
    let c = document.createElement('canvas');
    c.width = logo.width; c.height = logo.height;
    const x = c.getContext('2d');
    x.drawImage(logo, 0, 0);
    const fill = tint === 'white' ? '#FFFFFF' : tint === 'custom' ? color : null;
    if (fill){ x.globalCompositeOperation = 'source-in'; x.fillStyle = fill; x.fillRect(0, 0, c.width, c.height); }
    const list = [c];
    while (c.width > 160){
      const n = document.createElement('canvas');
      n.width = Math.round(c.width / 2); n.height = Math.max(1, Math.round(c.height / 2));
      const nx = n.getContext('2d');
      nx.imageSmoothingQuality = 'high';
      nx.drawImage(c, 0, 0, n.width, n.height);
      list.push(n); c = n;
    }
    chains.set(key, list);
    return list;
  }
  function logoFor(tint, w, color){
    if (!logo) return null;
    const list = chain(tint, color);
    let pick = list[0];
    for (const c of list) if (c.width >= w) pick = c;
    return pick;
  }

  /* 화면 */
  let noteT = 0;
  function note(msg, cls){
    const n = $('#savedNote');
    n.textContent = msg; n.className = 'saved ' + (cls || '');
    clearTimeout(noteT);
    if (cls === 'ok') noteT = setTimeout(() => { n.textContent = '설정은 브랜드별로 자동 저장돼요'; n.className = 'saved'; }, 2500);
  }
  let saveT = 0;
  function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }
  async function save(){
    const ok = await KV.set(KEY, state);
    note(ok ? '✓ 저장됨' : '⚠ 저장하지 못했어요 (브라우저 저장 공간 부족)', ok ? 'ok' : 'bad');
  }
  function render(){
    const p = cur();
    const list = $('#brandList');
    list.textContent = '';
    for (const q of state.profiles){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'bchip';
      b.textContent = q.name || '이름 없음';
      b.setAttribute('aria-pressed', q.id === p.id);
      b.onclick = () => { if (q.id !== state.current) select(q.id); };
      list.appendChild(b);
    }
    if (document.activeElement !== $('#brandName')) $('#brandName').value = p.name;
    const has = !!srcOf(p);
    $('#brandLogo').hidden = !logoURL;
    if (logoURL) $('#brandLogo').src = logoURL;
    $('#logoEmpty').hidden = !!logoURL;
    $('#logoEmpty').textContent = has && !logo ? '로고를 읽지 못했어요' : '로고 첨부';
    $('#logoPick').textContent = has ? '로고 바꾸기' : '로고 첨부';
    $('#removeWhite').checked = p.removeWhite;
    $('#removeWhiteWrap').hidden = !has;
    $('#builtinReset').hidden = !(p.builtin && p.logoSrc);
    $('#brandDelete').disabled = state.profiles.length < 2;
    const hl = $('#headLogo');
    hl.hidden = !logoURL;
    if (logoURL) hl.src = logoURL;
  }
  async function select(id){
    state.current = id;
    await loadLogo();
    render(); emit(); saveSoon();
  }
  async function refreshLogo(){ await loadLogo(); render(); emit(); saveSoon(); }

  async function setLogoFile(file){
    if (!file || !state) return;
    if (!(file.type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(file.name))) return;
    let src, img;
    try{ src = await fileToDataURL(file); img = await loadImg(src); }
    catch(e){ alert('이 이미지는 열 수 없어요. PNG나 JPG로 넣어주세요.'); return; }
    if (!img.naturalWidth){ alert('이 이미지는 크기를 알 수 없어요. PNG나 JPG로 넣어주세요.'); return; }
    // 너무 큰 로고는 줄여서 저장 (브라우저 저장 공간 아끼기)
    const big = Math.max(img.naturalWidth, img.naturalHeight);
    if (big > 1600 || file.size > 1.5e6){
      const k = Math.min(1, 1600 / big), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, c.width, c.height);
      src = c.toDataURL('image/png');
    }
    const p = cur();
    p.logoSrc = src;
    p.removeWhite = whiteCorners(img); // 네 귀퉁이가 하얀 로고면 흰 배경 지우기를 켜 둠
    await refreshLogo();
  }

  $('#logoInput').addEventListener('change', e => { setLogoFile(e.target.files[0]); e.target.value = ''; });
  $('#logoPick').addEventListener('click', () => $('#logoInput').click());
  $('#removeWhite').addEventListener('change', e => { cur().removeWhite = e.target.checked; refreshLogo(); });
  $('#builtinReset').addEventListener('click', () => { const p = cur(); p.logoSrc = null; p.removeWhite = false; refreshLogo(); });
  $('#brandName').addEventListener('input', e => { cur().name = e.target.value; render(); saveSoon(); });
  $('#brandName').addEventListener('blur', e => {
    if (!cur().name.trim()){ cur().name = '이름 없음'; e.target.value = cur().name; render(); saveSoon(); }
  });
  $('#brandAdd').addEventListener('click', async () => {
    const p = make('새 브랜드');
    state.profiles.push(p);
    await select(p.id);
    const n = $('#brandName'); n.focus(); n.select();
  });
  $('#brandDelete').addEventListener('click', async () => {
    const p = cur();
    if (state.profiles.length < 2) return;
    if (!confirm(`'${p.name}' 브랜드를 삭제할까요?\n저장해 둔 로고와 설정도 함께 지워져요.`)) return;
    state.profiles = state.profiles.filter(q => q.id !== p.id);
    await select(state.profiles[0].id);
  });

  return {
    init, cur, saveSoon, setLogoFile, logoFor,
    on: fn => subs.push(fn),
    hasLogo: () => !!logo,
    ratio: () => logo ? logo.height / logo.width : .75,
    name: () => cur() ? cur().name : '',
    box: $('#logoBox')
  };
})();
</script>

<script>
/* ======================= 로고 넣기 ======================= */
const LogoTool = (() => {
  const POS_NAMES = {tl:'왼쪽 위',tc:'가운데 위',tr:'오른쪽 위',ml:'왼쪽 가운데',mc:'정가운데',mr:'오른쪽 가운데',bl:'왼쪽 아래',bc:'가운데 아래',br:'오른쪽 아래'};
  const JPG_QUALITY = 0.92;
  const MAX_PX = 50e6; // 원본 크기로 저장할 때 5천만 화소 넘는 사진만 줄임 (크롬 메모리 보호)

  let opt = null;      // 지금 브랜드의 로고 설정 (바꾸면 브랜드에 그대로 저장됨)
  let items = [];      // {id, file, url, bad}
  let seq = 0, current = -1;
  let prevImg = null, raf = 0;
  let results = null;  // {out:[{name, blob}], failed}
  let busy = false;
  const form = $('#settings');

  /* ---------- 그리기 ---------- */
  function outSize(img){
    let W = img.naturalWidth, H = img.naturalHeight;
    if (opt.output === 'square') W = H = 1080;
    const k = Math.min(1, Math.sqrt(MAX_PX / (W * H)));
    return [Math.round(W * k), Math.round(H * k)];
  }
  function render(img, cv, limit){
    // 1080×1080은 잘라내지 않고 사진 전체를 정사각으로 맞춤(늘리기)
    let [W, H] = outSize(img);
    if (limit && Math.max(W, H) > limit){ const k = limit / Math.max(W, H); W = Math.round(W * k); H = Math.round(H * k); }
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (opt.format === 'jpg'){ ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); } // 투명 PNG를 JPG로 저장할 때 검게 안 나오게
    ctx.drawImage(img, 0, 0, W, H);

    // 크기 = 로고의 긴 쪽 길이가 사진 짧은 변의 몇 %인지
    const base = Math.min(W, H), r = Brand.ratio(), L = base * opt.size / 100;
    const lw = r <= 1 ? L : L / r, lh = r <= 1 ? L * r : L;
    const m = base * opt.margin / 100;
    const row = opt.pos[0], col = opt.pos[1];
    const x = col === 'l' ? m : col === 'r' ? W - lw - m : (W - lw) / 2;
    const y = row === 't' ? m : row === 'b' ? H - lh - m : (H - lh) / 2;
    const logo = Brand.logoFor(opt.tint, lw, opt.tintColor);
    if (!logo) return cv;
    ctx.save();
    ctx.globalAlpha = opt.opacity / 100;
    if (opt.shadow === 'on'){
      ctx.shadowColor = 'rgba(0,0,0,.35)';
      ctx.shadowBlur = Math.max(lw, lh) * 0.03;
      ctx.shadowOffsetY = Math.max(lw, lh) * 0.008;
    }
    ctx.drawImage(logo, x, y, lw, lh);
    ctx.restore();
    return cv;
  }
  function drawPreview(){
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const cv = $('#preview');
      const has = !!opt && !!prevImg && Brand.hasLogo();
      cv.hidden = !has; $('#emptyMsg').hidden = has; $('#meta').hidden = !has;
      $('#emptyMsg').textContent = !opt ? '' : !Brand.hasLogo()
        ? `'${Brand.name()}' 로고를 먼저 첨부해 주세요 (위쪽 브랜드 칸)`
        : '사진을 넣으면 여기서 미리 볼 수 있어요';
      if (!has) return;
      render(prevImg, cv, 1600);
      const [W, H] = outSize(prevImg);
      $('#metaName').textContent = items[current] ? items[current].file.name : '';
      $('#metaSize').textContent = `저장 크기 ${W}×${H}`;
    });
  }

  /* ---------- 사진 목록 ---------- */
  function addFiles(list){
    if (busy) return;
    const add = [...list].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp|heic|heif|avif)$/i.test(f.name));
    if (!add.length) return;
    const first = items.length;
    for (const f of add) items.push({id: ++seq, file: f, url: URL.createObjectURL(f), bad: false});
    invalidate();
    renderThumbs();
    select(first);
  }
  function removeItem(id){
    const i = items.findIndex(it => it.id === id);
    if (i < 0 || busy) return;
    URL.revokeObjectURL(items[i].url);
    items.splice(i, 1);
    invalidate();
    renderThumbs();
    if (i === current || current >= items.length) select(Math.min(i, items.length - 1));
    else { if (i < current) current--; markThumbs(); }
  }
  function clearAll(){
    if (busy) return;
    items.forEach(it => URL.revokeObjectURL(it.url));
    items = [];
    invalidate();
    renderThumbs();
    select(-1);
  }
  function renderThumbs(){
    const ul = $('#thumbs');
    ul.textContent = '';
    for (const it of items){
      const li = document.createElement('li');
      li.dataset.id = it.id;
      if (it.bad) li.classList.add('bad');
      li.innerHTML = '<button type="button" class="pick"><img alt="" loading="lazy"></button><button type="button" class="del" aria-label="빼기">×</button>';
      li.querySelector('img').src = it.url;
      li.querySelector('.pick').setAttribute('aria-label', it.file.name);
      li.querySelector('img').onerror = () => { it.bad = true; li.classList.add('bad'); };
      ul.appendChild(li);
    }
    $('#filesHead').hidden = !items.length;
    $('#count').textContent = `사진 ${items.length}장`;
    updateSaveBtn();
    markThumbs();
  }
  function markThumbs(){
    document.querySelectorAll('#thumbs li').forEach((li, i) => li.classList.toggle('on', i === current));
  }
  async function select(i){
    current = i;
    markThumbs();
    const it = items[i];
    if (!it){ prevImg = null; drawPreview(); return; }
    try{
      const img = await loadImg(it.url);
      if (items[current] !== it) return;
      prevImg = img;
    }catch(e){
      it.bad = true;
      prevImg = null;
      const li = document.querySelector(`#thumbs li[data-id="${it.id}"]`);
      if (li) li.classList.add('bad');
    }
    drawPreview();
  }
  $('#thumbs').addEventListener('click', e => {
    const li = e.target.closest('li');
    if (!li) return;
    const id = +li.dataset.id;
    if (e.target.closest('.del')) removeItem(id);
    else select(items.findIndex(it => it.id === id));
  });
  $('#clearBtn').addEventListener('click', clearAll);
  $('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });

  /* ---------- 설정 ---------- */
  function buildPosBox(){
    const box = $('#posBox');
    for (const r of 'tmb') for (const c of 'lcr'){
      const v = r + c;
      box.insertAdjacentHTML('beforeend', `<label title="${POS_NAMES[v]}"><input type="radio" name="pos" value="${v}" aria-label="${POS_NAMES[v]}"><span></span></label>`);
    }
  }
  function applyOpt(){
    for (const k of Object.keys(LOGO_DEFAULTS)){
      const el = form.elements[k];
      if (el) el.value = opt[k];
    }
    showOpt();
  }
  function showOpt(){
    $('#sizeOut').textContent = opt.size + '%';
    $('#marginOut').textContent = opt.margin + '%';
    $('#opacityOut').textContent = opt.opacity + '%';
    $('#posName').textContent = POS_NAMES[opt.pos];
    $('#outHint').textContent = opt.output === 'square' ? '잘림 없이 사진 전체를 정사각으로' : '사진 크기 그대로';
    $('#fmtHint').textContent = opt.format === 'png' ? '화질 그대로 · 블로그용' : '용량 작음';
  }
  function onOpt(e){
    const t = e.target;
    if (!opt || !t.name || !(t.name in LOGO_DEFAULTS)) return;
    if (busy){ applyOpt(); return; } // 저장 중에는 설정 고정
    if (t.name === 'tintColor' && opt.tint !== 'custom'){ opt.tint = 'custom'; form.elements.tint.value = 'custom'; }
    const v = t.type === 'range' ? +t.value : t.value;
    opt[t.name] = v;
    Brand.saveSoon();
    showOpt();
    invalidate();
    drawPreview();
  }
  form.addEventListener('input', onOpt);
  form.addEventListener('change', onOpt);
  $('#resetBtn').addEventListener('click', () => {
    if (!opt) return;
    Object.assign(opt, LOGO_DEFAULTS);
    Brand.saveSoon();
    applyOpt(); invalidate(); drawPreview();
  });

  /* ---------- 저장 ---------- */
  function invalidate(){ results = null; $('#result').hidden = true; }
  function setBusy(b){
    busy = b;
    document.body.classList.toggle('busy', b);
    $('#progress').hidden = !b;
    updateSaveBtn();
  }
  function updateSaveBtn(){
    const btn = $('#saveBtn');
    btn.disabled = busy || !items.length || !Brand.hasLogo();
    btn.textContent = busy ? '로고 넣는 중…' : items.length ? `로고 넣고 저장 (${items.length}장)` : '로고 넣고 저장';
  }
  function progress(done, total){
    $('#barFill').style.width = (done / total * 100) + '%';
    $('#progText').textContent = `${done} / ${total}`;
  }
  function outName(file, used){
    const base = file.name.replace(/\.[^.]+$/, '') || 'image';
    const tag = safeName(Brand.name()) || 'logo';
    const ext = opt.format === 'png' ? 'png' : 'jpg';
    let name = `${base}_${tag}.${ext}`, n = 2;
    while (used.has(name)) name = `${base}_${tag}_${n++}.${ext}`;
    used.add(name);
    return name;
  }
  async function processAll(){
    setBusy(true);
    const out = [], used = new Set();
    let failed = 0;
    const type = opt.format === 'png' ? 'image/png' : 'image/jpeg';
    const cv = document.createElement('canvas');
    for (let i = 0; i < items.length; i++){
      progress(i, items.length);
      await sleep(0); // 진행률 화면에 반영
      try{
        const img = await loadImg(items[i].url);
        render(img, cv);
        const blob = await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), type, JPG_QUALITY));
        out.push({name: outName(items[i].file, used), blob});
      }catch(e){
        failed++;
        items[i].bad = true;
      }
      cv.width = cv.height = 0; // 메모리 바로 반납
    }
    progress(items.length, items.length);
    setBusy(false);
    if (failed) renderThumbs();
    return {out, failed};
  }
  function stamp(){
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${String(d.getFullYear()).slice(2)}${p(d.getMonth() + 1)}${p(d.getDate())}`;
  }
  async function downloadResults(){
    const list = results.out;
    if (list.length === 1) return download(list[0].blob, list[0].name);
    if (window.JSZip){
      const zip = new JSZip();
      list.forEach(r => zip.file(r.name, r.blob));
      const blob = await zip.generateAsync({type:'blob', compression:'STORE'});
      download(blob, `${safeName(Brand.name()) || 'logo'}_로고_${stamp()}_${list.length}장.zip`);
    } else {
      // 압축 라이브러리를 못 불러왔을 때(인터넷 끊김 등)는 한 장씩
      for (const r of list){ download(r.blob, r.name); await sleep(400); }
    }
  }
  function showResult(){
    const {out, failed} = results;
    $('#resultText').innerHTML = `✓ ${out.length}장 완료` +
      (failed ? `<small>${failed}장은 열 수 없는 사진이라 건너뛰었어요 (HEIC 등)</small>` : '') +
      (out.length ? `<small>${out.length > 1 ? 'ZIP 파일로' : '사진 파일로'} 다운로드 폴더에 저장했어요</small>` : '');
    $('#downloadBtn').hidden = !out.length;
    $('#result').hidden = false;
  }
  $('#saveBtn').addEventListener('click', async () => {
    if (busy || !items.length || !Brand.hasLogo()) return;
    if (!results) results = await processAll();
    if (results.out.length) await downloadResults();
    showResult();
  });
  $('#downloadBtn').addEventListener('click', () => results && downloadResults());

  buildPosBox();
  // 브랜드를 바꾸거나 로고를 새로 넣으면 그 브랜드 설정으로 다시 그림
  Brand.on(() => { opt = Brand.cur().opt; applyOpt(); invalidate(); updateSaveBtn(); drawPreview(); });
  return {drop: $('#drop'), addFiles, redraw: drawPreview};
})();
</script>

<script>
/* ======================= 블로그 썸네일 ======================= */
const ThumbTool = (() => {
  const S = 1080;
  const TITLE_FONTS = {
    notoserif:  {label:'노토 세리프',  family:"'Noto Serif KR'",     weight:700},
    nanummj:    {label:'나눔명조',     family:"'Nanum Myeongjo'",    weight:800},
    gowunbt:    {label:'고운바탕',     family:"'Gowun Batang'",      weight:700},
    pretendard: {label:'프리텐다드',   family:"'Pretendard Variable'", weight:800},
    gowundd:    {label:'고운돋움',     family:"'Gowun Dodum'",       weight:400},
    blackhan:   {label:'검은고딕',     family:"'Black Han Sans'",    weight:400},
    jua:        {label:'주아',         family:"'Jua'",               weight:400},
    pen:        {label:'나눔손글씨 펜', family:"'Nanum Pen Script'",  weight:400, scale:1.3, ui:22}
  };
  const BODY_FONTS = {
    pretendard: {label:'프리텐다드', family:"'Pretendard Variable'", w:{n:500, b:600, x:700}},
    gowundd:    {label:'고운돋움',   family:"'Gowun Dodum'",         w:{n:400, b:400, x:400}},
    nanumgothic:{label:'나눔고딕',   family:"'Nanum Gothic'",        w:{n:400, b:700, x:800}}
  };
  const FRAME_SWATCHES = [['#F7F3EC','베이지'], ['#FFFFFF','화이트'], ['#E6D5BF','샌드'], ['#DDE3D6','세이지'], ['#6F5240','브라운'], ['#2C2925','차콜']];

  let th = null;                                  // 지금 브랜드의 썸네일 설정 (바꾸면 브랜드에 저장됨)
  const st = {fx:.5, fy:.5, zoom:100, bright:100}; // 사진 위치·확대·밝기는 사진마다 새로
  let photo = null;
  let over = {x:0, y:0};   // 사진이 칸보다 넘치는 양 (끌기 계산용)
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const info = $('#thumbInfo'), design = $('#thumbDesign');

  const TF = () => TITLE_FONTS[th.titleFont] || TITLE_FONTS.notoserif;
  const BF = () => BODY_FONTS[th.bodyFont] || BODY_FONTS.pretendard;
  const titleFont = s => `${TF().weight} ${Math.round(s)}px ${TF().family}, serif`;
  const bodyFont = (wk, s) => `${BF().w[wk]} ${Math.round(s)}px ${BF().family}, 'Malgun Gothic', sans-serif`;
  function isDark(hex){
    const n = parseInt(hex.slice(1), 16);
    return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 < .55;
  }

  /* ---------- 로고 ---------- */
  function fitLogo(maxW, maxH){
    const r = Brand.ratio();
    let w = maxW, h = w * r;
    if (h > maxH){ h = maxH; w = h / r; }
    return {w, h};
  }
  function drawLogo(tint, x, y, w, h, shadow){
    const L = Brand.logoFor(tint, w);
    if (!L) return;
    ctx.save();
    if (shadow){ ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 2; }
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(L, x, y, w, h);
    ctx.restore();
  }

  /* ---------- 글자 ---------- */
  function splitTwo(t){
    const sp = [...t.matchAll(/ /g)].map(m => m.index);
    if (!sp.length){ const h = Math.ceil(t.length / 2); return [t.slice(0, h), t.slice(h)]; }
    const mid = t.length / 2;
    const i = sp.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
    return [t.slice(0, i), t.slice(i + 1)];
  }
  // 한 줄에 맞춰 글자 크기를 줄이고, 너무 작아지면 두 줄로
  function fitTitle(text, max, min, width){
    const sc = TF().scale || 1;
    max = Math.round(max * sc); min = Math.round(min * sc);
    const one = Math.round(max * .72);
    for (let s = max; s >= one; s -= 2){
      ctx.font = titleFont(s);
      if (ctx.measureText(text).width <= width) return {lines:[text], size:s};
    }
    const lines = splitTwo(text);
    for (let s = max; s >= min; s -= 2){
      ctx.font = titleFont(s);
      if (lines.every(l => ctx.measureText(l).width <= width)) return {lines, size:s};
    }
    return {lines, size:min};
  }
  function fitLine(text, wk, max, min, width){
    let s = max;
    for (; s > min; s -= 1){
      ctx.font = bodyFont(wk, s);
      if (ctx.measureText(text).width <= width) break;
    }
    return s;
  }
  function pillW(text, o){
    ctx.font = bodyFont('b', o.fs);
    return ctx.measureText(text).width + o.px * 2 + (o.dot ? o.fs * .62 + 10 : 0);
  }
  function pill(x, y, text, o){
    const w = pillW(text, o);
    ctx.beginPath(); ctx.roundRect(x, y, w, o.h, o.h / 2);
    if (o.bg){ ctx.fillStyle = o.bg; ctx.fill(); }
    if (o.stroke){ ctx.strokeStyle = o.stroke; ctx.lineWidth = 2; ctx.stroke(); }
    let tx = x + o.px;
    if (o.dot){
      const r = o.fs * .31;
      ctx.beginPath(); ctx.arc(tx + r, y + o.h / 2, r, 0, Math.PI * 2);
      ctx.fillStyle = o.dot; ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2; ctx.stroke();
      tx += r * 2 + 10;
    }
    ctx.fillStyle = o.fg; ctx.textBaseline = 'middle';
    ctx.font = bodyFont('b', o.fs);
    ctx.fillText(text, tx, y + o.h / 2 + 1);
    return w;
  }
  const chipItems = d => [d.mat && {text:d.mat}, d.color && {text:d.color, dot:d.dot}].filter(Boolean);
  // 매트·컬러 칩을 한 줄로 (넓으면 글자를 줄여서 맞춤)
  function chipRow(x, y, maxW, items, base){
    let fs = base.fs;
    const total = f => items.reduce((s, it) => s + pillW(it.text, {...base, fs:f, dot:it.dot}), 0) + (items.length - 1) * 12;
    while (fs > 18 && total(fs) > maxW) fs--;
    for (const it of items) x += pill(x, y, it.text, {...base, fs, dot:it.dot}) + 12;
  }
  function label(text, x, cy, size, color){
    ctx.save();
    ctx.fillStyle = color; ctx.textBaseline = 'middle';
    ctx.font = bodyFont('x', size);
    ctx.letterSpacing = Math.round(size * .22) + 'px';
    ctx.fillText(text, x, cy);
    ctx.restore();
  }

  /* ---------- 사진 ---------- */
  function drawPhoto(a, r){
    ctx.save();
    ctx.beginPath();
    if (r) ctx.roundRect(a.x, a.y, a.w, a.h, r); else ctx.rect(a.x, a.y, a.w, a.h);
    ctx.clip();
    if (!photo){
      ctx.fillStyle = '#E4D8C7'; ctx.fillRect(a.x, a.y, a.w, a.h);
      ctx.fillStyle = '#B3A08A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = bodyFont('b', 34);
      ctx.fillText('사진을 넣어주세요', a.x + a.w / 2, a.y + a.h * .5);
      ctx.restore();
      over = {x:0, y:0};
      return;
    }
    const sc = Math.max(a.w / photo.width, a.h / photo.height) * st.zoom / 100;
    const dw = photo.width * sc, dh = photo.height * sc;
    if (st.bright !== 100) ctx.filter = `brightness(${st.bright / 100})`;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(photo, a.x - (dw - a.w) * st.fx, a.y - (dh - a.h) * st.fy, dw, dh);
    ctx.restore();
    over = {x:dw - a.w, y:dh - a.h};
  }

  /* ---------- 디자인 3종 ---------- */
  // 카드형: 사진 전체 + 위쪽 흰 카드 + 오른쪽 아래 로고 배지
  function tplCard(d){
    drawPhoto({x:0, y:0, w:S, h:S});
    const M = 56, P = 52, cw = S - M * 2, iw = cw - P * 2;
    const t = fitTitle(d.apt, 80, 50, iw);
    const lh = t.size * 1.24;
    const spFs = d.space ? fitLine(d.space, 'n', 34, 22, iw) : 0;
    const chips = chipItems(d), chipH = 58;
    const h = P + 26 + 20 + lh * t.lines.length + (d.space ? 12 + spFs * 1.35 : 0) + (chips.length ? 30 + chipH : 0) + P;
    const x0 = M, y0 = M;

    ctx.save();
    ctx.shadowColor = 'rgba(40,28,20,.22)'; ctx.shadowBlur = 44; ctx.shadowOffsetY = 12;
    ctx.beginPath(); ctx.roundRect(x0, y0, cw, h, 30);
    ctx.fillStyle = 'rgba(255,253,248,.96)'; ctx.fill();
    ctx.restore();

    let y = y0 + P;
    label('시공 사례', x0 + P, y + 13, 24, '#A0826A');
    y += 26 + 20;
    ctx.fillStyle = '#4A3628'; ctx.textBaseline = 'middle'; ctx.font = titleFont(t.size);
    for (const l of t.lines){ ctx.fillText(l, x0 + P, y + lh / 2); y += lh; }
    if (d.space){
      y += 12;
      ctx.fillStyle = '#6F5240'; ctx.font = bodyFont('n', spFs);
      ctx.fillText(d.space, x0 + P, y + spFs * 1.35 / 2);
      y += spFs * 1.35;
    }
    if (chips.length){
      y += 30;
      chipRow(x0 + P, y, iw, chips, {h:chipH, fs:27, px:24, bg:'#F1E9DD', fg:'#5A4232'});
    }
    if (Brand.hasLogo()){
      const L = fitLogo(170, 92), bp = 22, bw = L.w + bp * 2, bh = L.h + bp * 2;
      const bx = S - M - bw, by = S - M - bh;
      ctx.save();
      ctx.shadowColor = 'rgba(40,28,20,.2)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
      ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 22);
      ctx.fillStyle = 'rgba(255,253,248,.95)'; ctx.fill();
      ctx.restore();
      drawLogo('orig', bx + bp, by + bp, L.w, L.h);
    }
  }

  // 매거진형: 사진 전체 + 아래 어둡게 + 흰 글씨
  function tplOverlay(d){
    drawPhoto({x:0, y:0, w:S, h:S});
    let g = ctx.createLinearGradient(0, S * .28, 0, S);
    g.addColorStop(0, 'rgba(24,18,14,0)');
    g.addColorStop(.5, 'rgba(24,18,14,.42)');
    g.addColorStop(1, 'rgba(24,18,14,.84)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
    g = ctx.createLinearGradient(0, 0, 0, 280);
    g.addColorStop(0, 'rgba(24,18,14,.38)');
    g.addColorStop(1, 'rgba(24,18,14,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, S, 280);
    if (Brand.hasLogo()){ const L = fitLogo(170, 110); drawLogo('white', 64, 60, L.w, L.h, true); }

    const P = 70, w = S - P * 2;
    const t = fitTitle(d.apt, 100, 60, w);
    const lh = t.size * 1.2;
    ctx.textBaseline = 'middle';
    let y = S - P;
    const line = [d.mat, d.color].filter(Boolean).join('   ·   ');
    if (line){
      const inFs = fitLine(line, 'n', 31, 20, w);
      ctx.font = bodyFont('n', inFs); ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillText(line, P, y - inFs / 2);
      y -= inFs + 28;
    }
    ctx.fillStyle = '#CDAE88'; ctx.fillRect(P, y - 3, 64, 3);
    y -= 3 + 28;
    if (d.space){
      const sFs = fitLine(d.space, 'b', 40, 24, w);
      ctx.font = bodyFont('b', sFs); ctx.fillStyle = '#fff';
      ctx.fillText(d.space, P, y - sFs * 1.3 / 2);
      y -= sFs * 1.3 + 16;
    }
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 20;
    ctx.font = titleFont(t.size); ctx.fillStyle = '#fff';
    for (let i = t.lines.length - 1; i >= 0; i--){ ctx.fillText(t.lines[i], P, y - lh / 2); y -= lh; }
    ctx.restore();
    y -= 18;
    pill(P, y - 50, '시공 사례', {h:50, fs:23, px:22, stroke:'rgba(255,255,255,.7)', fg:'#fff'});
  }

  // 액자형: 사진 전체 위에 반투명 테두리(덮개) + 아래 글씨. 테두리 색이 어두우면 글씨는 흰색
  function tplFrame(d){
    drawPhoto({x:0, y:0, w:S, h:S});
    const fc = th.frameColor, dark = isDark(fc);
    const ink = dark ? '#FFFFFF' : '#4A3628', sub = dark ? 'rgba(255,255,255,.88)' : '#6F5240', lab = dark ? 'rgba(255,255,255,.72)' : '#A0826A';
    const M = 48, x0 = M + 14;
    const L = Brand.hasLogo() ? fitLogo(160, 118) : null;
    const tw = S - x0 * 2 - (L ? L.w + 36 : 0);
    const t = fitTitle(d.apt, 68, 44, tw);
    const lh = t.size * 1.24;
    const spFs = d.space ? fitLine(d.space, 'n', 32, 20, tw) : 0;
    const chips = chipItems(d), chipH = 52;
    const block = 24 + 16 + lh * t.lines.length + (d.space ? 8 + spFs * 1.35 : 0) + (chips.length ? 24 + chipH : 0);
    const ph = S - M - 38 - block - 54;

    // 사진 창만 뚫고 나머지를 테두리 색으로 반투명하게 덮음
    ctx.save();
    ctx.globalAlpha = th.frameAlpha / 100;
    ctx.fillStyle = fc;
    ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.roundRect(M, M, S - M * 2, ph, 26);
    ctx.fill('evenodd');
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(M, M, S - M * 2, ph, 26); ctx.stroke();
    ctx.restore();

    let y = M + ph + 38;
    const yTop = y;
    label('시공 사례', x0, y + 12, 22, lab);
    y += 24 + 16;
    ctx.fillStyle = ink; ctx.textBaseline = 'middle'; ctx.font = titleFont(t.size);
    for (const l of t.lines){ ctx.fillText(l, x0, y + lh / 2); y += lh; }
    if (d.space){
      y += 8;
      ctx.fillStyle = sub; ctx.font = bodyFont('n', spFs);
      ctx.fillText(d.space, x0, y + spFs * 1.35 / 2);
      y += spFs * 1.35;
    }
    if (chips.length){
      y += 24;
      chipRow(x0, y, tw, chips, dark
        ? {h:chipH, fs:25, px:22, bg:'rgba(255,255,255,.14)', stroke:'rgba(255,255,255,.45)', fg:'#fff'}
        : {h:chipH, fs:25, px:22, bg:'#fff', stroke:'#E3D8C8', fg:'#5A4232'});
    }
    if (L) drawLogo(dark ? 'white' : 'orig', S - x0 - L.w, yTop + (block - L.h) / 2, L.w, L.h);
  }

  const TPL = {card:tplCard, overlay:tplOverlay, frame:tplFrame};

  /* ---------- 그리기 ---------- */
  function data(){
    return {
      apt: $('#apt').value.trim() || '아파트 이름',
      space: $('#space').value.trim(),
      mat: th.mat.trim(),
      color: th.color.trim(),
      dot: th.dot
    };
  }
  let raf = 0;
  function draw(){
    if (!th) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(async () => {
      const d = data();
      const txt = d.apt + d.space + d.mat + d.color + '시공 사례 ·사진을 넣어주세요';
      // 웹폰트가 받아지기 전에 그리면 기본 글꼴로 나와서, 필요한 글자를 먼저 받아둠
      try{
        await Promise.all([
          document.fonts.load(titleFont(80), txt),
          document.fonts.load(bodyFont('n', 30), txt),
          document.fonts.load(bodyFont('b', 30), txt),
          document.fonts.load(bodyFont('x', 30), txt)
        ]);
      }catch(e){}
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, S, S);
      (TPL[th.tpl] || tplCard)(d);
    });
  }
  function ready(){
    const ok = !!photo && !!$('#apt').value.trim();
    $('#tSaveBtn').disabled = $('#copyBtn').disabled = !ok;
    $('#tSaveBtn').title = $('#copyBtn').title = ok ? '' : '사진과 아파트 이름을 넣어주세요';
  }

  /* ---------- 사진 넣기 ---------- */
  async function setPhoto(file){
    if (!file || !(file.type.startsWith('image/') || /\.(jpe?g|png|webp|gif|bmp|avif)$/i.test(file.name))) return;
    const url = URL.createObjectURL(file);
    try{
      const img = await loadImg(url);
      // 끌 때 버벅이지 않도록 긴 변 2800px로 줄여서 들고 있음 (확대 250%까지 충분)
      const k = Math.min(1, 2800 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const x = c.getContext('2d');
      x.imageSmoothingQuality = 'high';
      x.drawImage(img, 0, 0, c.width, c.height);
      photo = c;
      st.fx = st.fy = .5; st.zoom = 100; st.bright = 100; applyTh();
      $('#tThumb').src = url; $('#tThumb').hidden = false; $('#tThumbEmpty').hidden = true;
      $('#dropTitle').textContent = '다른 사진으로 바꾸기';
      $('#dropSub').textContent = file.name;
      $('#hint').textContent = '미리보기를 끌어서 사진 위치를, 마우스 휠로 확대를 조절할 수 있어요';
      cv.classList.add('can-drag');
      toast('');
      ready(); draw();
    }catch(e){
      URL.revokeObjectURL(url);
      alert('이 사진은 열 수 없어요. JPG나 PNG로 넣어주세요. (아이폰 HEIC는 크롬에서 안 열려요)');
    }
  }
  $('#tFileInput').addEventListener('change', e => { setPhoto(e.target.files[0]); e.target.value = ''; });

  /* ---------- 사진 끌기 · 휠 확대 ---------- */
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    if (!photo) return;
    drag = {x:e.clientX, y:e.clientY, fx:st.fx, fy:st.fy};
    cv.setPointerCapture(e.pointerId);
    cv.classList.add('dragging');
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const k = S / cv.getBoundingClientRect().width;
    if (over.x > 0) st.fx = Math.min(1, Math.max(0, drag.fx - (e.clientX - drag.x) * k / over.x));
    if (over.y > 0) st.fy = Math.min(1, Math.max(0, drag.fy - (e.clientY - drag.y) * k / over.y));
    draw();
  });
  const endDrag = () => { drag = null; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('wheel', e => {
    if (!photo) return;
    e.preventDefault();
    st.zoom = Math.min(250, Math.max(100, Math.round(st.zoom - e.deltaY * .1)));
    applyTh(); draw();
  }, {passive:false});

  /* ---------- 설정 ---------- */
  function buildPickers(){
    const fontOpt = (name, k, f) => `<label><input type="radio" name="${name}" value="${k}"><span style="font-family:${f.family};font-weight:${f.weight || f.w.b}${f.ui ? `;font-size:${f.ui}px` : ''}">${f.label}</span></label>`;
    $('#titleFontPick').innerHTML = Object.entries(TITLE_FONTS).map(([k, f]) => fontOpt('titleFont', k, f)).join('');
    $('#bodyFontPick').innerHTML = Object.entries(BODY_FONTS).map(([k, f]) => fontOpt('bodyFont', k, f)).join('');
    const sw = $('#frameSwatches');
    // 미리 정한 색들 → 맨 끝에 직접 고르기
    for (const [c, n] of FRAME_SWATCHES)
      design.elements.frameColor.insertAdjacentHTML('beforebegin', `<button type="button" class="sw" data-color="${c}" style="background:${c}" title="${n}" aria-label="${n}"></button>`);
    sw.addEventListener('click', e => {
      const b = e.target.closest('.sw');
      if (!b || !th) return;
      th.frameColor = b.dataset.color;
      Brand.saveSoon(); applyTh(); draw();
    });
  }
  // force: 브랜드를 바꿨을 때는 입력 중인 글자칸도 그 브랜드 값으로 덮어씀
  function applyTh(force){
    if (!th) return;
    for (const f of [info, design])
      for (const k of Object.keys(THUMB_DEFAULTS)){
        const el = f.elements[k];
        if (!el) continue;
        if (el instanceof HTMLInputElement && el.type === 'text' && document.activeElement === el && !force) continue;
        el.value = th[k];
      }
    design.elements.zoom.value = st.zoom;
    design.elements.bright.value = st.bright;
    $('#zoomOut').textContent = st.zoom + '%';
    $('#brightOut').textContent = st.bright + '%';
    $('#frameAlphaOut').textContent = th.frameAlpha + '%';
    $('#frameColorRow').hidden = $('#frameAlphaRow').hidden = th.tpl !== 'frame';
    document.querySelectorAll('#frameSwatches .sw').forEach(b => b.classList.toggle('on', b.dataset.color.toLowerCase() === th.frameColor.toLowerCase()));
  }
  function onInput(e){
    const t = e.target;
    if (!th || !t.name) return;
    if (t.name === 'apt' || t.name === 'space'){ ready(); draw(); return; }
    if (t.name === 'zoom' || t.name === 'bright'){ st[t.name] = +t.value; applyTh(); draw(); return; }
    if (!(t.name in THUMB_DEFAULTS)) return;
    th[t.name] = t.type === 'range' ? +t.value : t.value;
    Brand.saveSoon();
    applyTh(); draw();
  }
  for (const f of [info, design]){
    f.addEventListener('input', onInput);
    f.addEventListener('change', onInput);
  }
  $('#resetPhoto').addEventListener('click', () => { st.fx = st.fy = .5; st.zoom = 100; st.bright = 100; applyTh(); draw(); });

  /* ---------- 저장 · 복사 ---------- */
  let toastT = 0;
  function toast(msg){
    $('#toast').textContent = msg;
    clearTimeout(toastT);
    if (msg) toastT = setTimeout(() => $('#toast').textContent = '', 4000);
  }
  const pngBlob = () => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/png'));
  $('#tSaveBtn').addEventListener('click', async () => {
    const blob = await pngBlob();
    download(blob, `썸네일_${safeName($('#apt').value)}.png`);
    toast('다운로드 폴더에 저장했어요');
  });
  $('#copyBtn').addEventListener('click', async () => {
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/png': pngBlob()})]);
      toast('복사했어요 · 블로그 글쓰기 화면에서 Ctrl+V 하면 들어가요');
    }catch(e){
      toast('');
      alert('복사가 안 되는 환경이에요. "PNG로 저장"을 눌러주세요.');
    }
  });

  buildPickers();
  document.fonts.addEventListener('loadingdone', draw);
  Brand.on(() => { th = Brand.cur().thumb; applyTh(true); ready(); draw(); });
  return {drop: $('#tDrop'), addFiles: files => setPhoto(files[0]), redraw: draw};
})();
</script>

<script>
/* ======================= 탭 · 끌어다 놓기 · 시작 ======================= */
const TOOLS = {logo: LogoTool, thumb: ThumbTool};
const TAB_INFO = {
  logo: {title:'로고 편집기', desc:'사진 여러 장에 브랜드 로고를 한 번에 넣어요'},
  thumb:{title:'블로그 썸네일', desc:'사진 한 장과 시공 정보로 썸네일을 만들어요'}
};
let tab = 'logo';
function showTab(t){
  if (!TOOLS[t]) t = 'logo';
  tab = t;
  $('#tool-logo').hidden = t !== 'logo';
  $('#tool-thumb').hidden = t !== 'thumb';
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  $('#pageTitle').textContent = TAB_INFO[t].title;
  $('#pageDesc').textContent = TAB_INFO[t].desc;
  store.set('tools-tab', t);
  try{ history.replaceState(null, '', t === 'thumb' ? '#thumbnail' : location.pathname + location.search); }catch(e){}
  TOOLS[t].redraw();
}
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

// 파일을 창 어디에 끌어다 놓든: 브랜드 로고 칸이면 로고로, 아니면 지금 탭의 사진으로
const zoneFor = e => (e.target instanceof Element && e.target.closest('#logoBox')) ? Brand.box : TOOLS[tab].drop;
let overZone = null;
function markOver(z){
  if (overZone && overZone !== z) overZone.classList.remove('over');
  overZone = z;
  if (z) z.classList.add('over');
}
['dragenter','dragover'].forEach(t => addEventListener(t, e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); markOver(zoneFor(e));
}));
addEventListener('dragleave', e => { if (!e.relatedTarget) markOver(null); });
addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  const z = zoneFor(e);
  markOver(null);
  if (z === Brand.box) Brand.setLogoFile(e.dataTransfer.files[0]);
  else TOOLS[tab].addFiles(e.dataTransfer.files);
});
addEventListener('paste', e => {
  if (!e.clipboardData || !e.clipboardData.files.length) return;
  e.preventDefault();
  TOOLS[tab].addFiles(e.clipboardData.files);
});

addEventListener('DOMContentLoaded', () => {
  showTab(location.hash === '#thumbnail' ? 'thumb' : (store.get('tools-tab') || 'logo'));
  Brand.init();
});
</script>
